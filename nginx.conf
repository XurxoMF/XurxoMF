server {
	listen 3000;
	listen [::]:3000;
	server_name _;

	root /usr/share/nginx/html;
	index index.html;
	charset utf-8;

	add_header X-Content-Type-Options "nosniff" always;
	add_header Referrer-Policy "strict-origin-when-cross-origin" always;

	location /_app/immutable/ {
		try_files $uri =404;
		expires 1y;
		add_header Cache-Control "public, immutable";
	}

	location = /health {
		access_log off;
		default_type text/plain;
		return 200 "ok\n";
	}

	location / {
		rewrite ^/(.+)/$ /$1 permanent;
		try_files $uri.html $uri /200.html;
	}

	gzip on;
	gzip_vary on;
	gzip_min_length 1024;
	gzip_types
		text/plain
		text/css
		application/javascript
		application/json
		application/xml
		image/svg+xml;
}
